% TeX4ht configuration for the HTML reader and EPUB. The source is compiled
% unchanged; this file only adds semantic hooks for library-specific macros.
\Preamble{xhtml,html5,fn-in,mathml,charset=utf-8}
\begin{document}
% Suppress the inert chapter counter outside numberedchapters. Otherwise
% chapter 2 and section 20 can both get the address x1-20000.
\renewcommand\thechapter{}
% Use the number stored in the contents entry even though chapter numbering
% is scoped to the divisions and the contents sits outside those divisions.
\ifdefined\tocchapter
  \let\ollOriginalTocChapter\tocchapter
  \renewcommand\tocchapter[3]{%
    \begingroup
    \if\relax\detokenize{#1}\relax\else
      \csname c@secnumdepth\endcsname=0\relax
    \fi
    \ollOriginalTocChapter{#1}{#2}{#3}%
    \endgroup}
\fi
% Attributes use single quotes: babel's German shorthands make " active.
% Source-page markers (\quellseite{n}) become anchors, whether or not the
% document shows them in its own PDF margin.
\ifdefined\quellseite
  \renewcommand\quellseite[1]{\HCode{<span class='quellseite' data-page='#1'></span>}\ignorespaces}
\fi
% Title pages are centered blocks, as \begin{titlepage}\centering sets them.
\ConfigureEnv{titlepage}{\ifvmode\IgnorePar\fi\EndP\HCode{<div class='titlepage'>}}{\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
% Print-only rotation must not wrap a block table in an inline span: Debian's
% DOM repair fails on that nesting. Digital registers stay upright instead.
\ifdefined\sideways
  \renewenvironment{sideways}{\ifvmode\IgnorePar\fi\EndP}{\ifvmode\IgnorePar\fi\EndP}
\fi
% Uncertain OCR readings stay visible but marked for the reader.
\ifdefined\unsicher
  \renewcommand\unsicher[1]{\HCode{<span class='unsicher'>}#1\HCode{</span>}}
\fi
\ifdefined\hebraeisch
  \renewcommand\hebraeisch[1]{\HCode{<span lang='he' dir='rtl'>}#1\HCode{</span>}}
\fi
% Letter-spaced emphasis (oll-book's \gesperrt).
\ifdefined\gesperrt
  \renewcommand\gesperrt[1]{\HCode{<span class='gesperrt'>}#1\HCode{</span>}}
\fi
% Register the score image with TeX4ht, so tex4ebook packages it too.
\ifdefined\notensatz
  \renewcommand\notensatz[2]{\ifvmode\IgnorePar\fi\EndP
    \HCode{<div class='notensatz'>}%
    \IfFileExists{#1.svg}{%
      {\Configure{Needs}{File: #1.svg}\Needs{}}\Picture[#2]{{#1.svg}}%
    }{%
      {\Configure{Needs}{File: #1.png}\Needs{}}\Picture[#2]{{#1.png}}%
    }\HCode{</div>}}
\fi
\EndPreamble
