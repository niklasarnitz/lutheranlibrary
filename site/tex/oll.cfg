% TeX4ht configuration for the HTML reader and EPUB. The source is compiled
% unchanged; this file only adds semantic hooks for library-specific macros.
\Preamble{xhtml,html5,fn-in,mathml,charset=utf-8}
\begin{document}
% Attributes use single quotes: babel's German shorthands make " active.
% Source-page markers (\quellseite{n}) become anchors, whether or not the
% document shows them in its own PDF margin.
\ifdefined\quellseite
  \renewcommand\quellseite[1]{\HCode{<span class='quellseite' data-page='#1'></span>}\ignorespaces}
\fi
% Title pages are centered blocks, as \begin{titlepage}\centering sets them.
\ConfigureEnv{titlepage}{\ifvmode\IgnorePar\fi\EndP\HCode{<div class='titlepage'>}}{\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}{}{}
% Uncertain OCR readings stay visible but marked for the reader.
\ifdefined\unsicher
  \renewcommand\unsicher[1]{\HCode{<span class='unsicher'>}#1\HCode{</span>}}
\fi
% Letter-spaced emphasis (oll-book's \gesperrt).
\ifdefined\gesperrt
  \renewcommand\gesperrt[1]{\HCode{<span class='gesperrt'>}#1\HCode{</span>}}
\fi
\EndPreamble
