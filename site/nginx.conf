server {
    listen 8080;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;
    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header in a location replaces the server's, so every location includes the same set.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'";

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300";
    }
    # Asset URLs carry a content hash (?v=...).
    location /static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.epub$ {
        types { }
        default_type application/epub+zip;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ \.(pdf|zip)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    # Download URLs of the former Django site.
    location ~ ^/works/([a-z0-9-]+)/download/(pdf|epub)/$ {
        return 301 /works/$1/$1.$2;
    }
    location ~ ^/works/([a-z0-9-]+)/download/tex/$ {
        return 301 /works/$1/$1-latex.zip;
    }
    location = /health/ {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }
}
