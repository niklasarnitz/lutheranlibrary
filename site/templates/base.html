<!doctype html>
<html lang="{% block lang %}en{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}An open reading room for Lutheran books. Read online or download PDF and EPUB editions typeset with LaTeX.{% endblock %}">
  <title>{% block title %}The collection{% endblock %} | OpenLutheranLibrary</title>
  <link rel="stylesheet" href="{{ static('library.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <a class="brand" href="/" aria-label="OpenLutheranLibrary home">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 11c8-2 13 0 19 4 6-4 11-6 19-4v28c-8-2-13 0-19 4-6-4-11-6-19-4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 15v28M24 3v8M20 7h8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>OpenLutheran<span class="brand-last">Library</span></span>
  </a>
</header>
{% macro library_links() %}
    <a {% if page == 'catalog' %}aria-current="page"{% endif %} href="/">Collection</a>
    <a {% if page == 'books' %}aria-current="page"{% endif %} href="/books/">Books</a>
    <a {% if page == 'magazines' %}aria-current="page"{% endif %} href="/magazines/">Magazines</a>
    <a {% if page == 'topics' %}aria-current="page"{% endif %} href="/topics/">Topical Index</a>
    <a class="nav-about" {% if page == 'about' %}aria-current="page"{% endif %} href="/about/">About the library</a>
{% endmacro %}
<nav class="site-nav" aria-label="Library">
  <div class="desktop-links">{{ library_links() }}</div>
  <details class="mobile-menu">
    <summary>Library menu</summary>
    <div class="mobile-links">{{ library_links() }}</div>
  </details>
</nav>
<div class="shell">
<main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
</div>
</body>
</html>
